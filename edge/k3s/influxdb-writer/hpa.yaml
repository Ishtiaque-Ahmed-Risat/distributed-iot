---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: influxdb-writer-hpa
  namespace: iot-edge
  labels:
    app: influxdb-writer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: influxdb-writer
  minReplicas: 2
  maxReplicas: 10  # Higher throughput for InfluxDB writes
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
