---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformation-service
  namespace: iot-edge
  labels:
    app: transformation-service
    component: data-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transformation-service
  template:
    metadata:
      labels:
        app: transformation-service
        component: data-pipeline
    spec:
      containers:
      - name: transformation-service
        image: transformation-service:latest
        imagePullPolicy: Never  # For local K3s development
        env:
        - name: REDPANDA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: REDPANDA_BROKERS
        - name: INPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: REDPANDA_TOPIC_RAW
        - name: OUTPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: REDPANDA_TOPIC_TRANSFORMED
        - name: CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: CONSUMER_GROUP_TRANSFORMATION
        - name: ENABLE_LLM
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: ENABLE_LLM
        - name: LLM_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: edge-config
              key: LLM_SERVICE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
