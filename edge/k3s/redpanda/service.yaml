---
# Regular service for client access (load-balanced)
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: iot-edge
  labels:
    app: redpanda
spec:
  type: NodePort
  selector:
    app: redpanda
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
    nodePort: 31092
    protocol: TCP
  - name: admin
    port: 9644
    targetPort: 9644
    nodePort: 31964
    protocol: TCP
