---
apiVersion: v1
kind: Secret
metadata:
  name: edge-secrets
  namespace: iot-edge
type: Opaque
stringData:
  # InfluxDB Credentials
  INFLUX_TOKEN: "my-super-secret-token"
  INFLUX_ADMIN_PASSWORD: "adminpassword"
  
  # EMQX Credentials (if needed for auth)
  EMQX_ADMIN_PASSWORD: "public"
  
  # Add other secrets as needed
  # For production, use actual secure values
