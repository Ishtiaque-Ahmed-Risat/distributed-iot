---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: iot-edge
  labels:
    app: influxdb
spec:
  type: NodePort
  selector:
    app: influxdb
  ports:
  - name: http
    port: 8086
    targetPort: 8086
    nodePort: 31086
    protocol: TCP
  # Route traffic to node-local InfluxDB pod (DaemonSet)
  # This ensures writer pods connect to InfluxDB on the same node (zero network hops)
  internalTrafficPolicy: Local