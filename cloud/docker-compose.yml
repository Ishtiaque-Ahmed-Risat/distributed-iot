version: '3.8'

# ============================================
# IoT Cloud Infrastructure
# ============================================
# Start:  ./start-cloud.sh  (or docker-compose up -d)
# ML Job: docker-compose -f docker-compose.yml -f docker-compose.job.yml run spark-job
# ============================================

services:
  # ============================================
  # Message Queue - Redpanda (Cloud)
  # ============================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: cloud-redpanda
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=2G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${HOST_IP:-localhost}:29092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:28082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://${HOST_IP:-localhost}:28082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:28081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "29092:29092"  # Kafka API (external)
      - "28082:28082"  # HTTP Proxy
      - "28081:28081"  # Schema Registry
      - "29644:9644"   # Admin API
    volumes:
      - cloud-redpanda-data:/var/lib/redpanda/data
    networks:
      - cloud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================
  # Cassandra (Time-Series Database)
  # ============================================
  cassandra:
    image: cassandra:4.1
    container_name: cloud-cassandra
    ports:
      - "9042:9042"   # CQL
    environment:
      - CASSANDRA_CLUSTER_NAME=IoTCluster
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - cloud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============================================
  # MinIO (S3-compatible Data Lake)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - cloud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Init: Redpanda Topics
  # ============================================
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: cloud-redpanda-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Redpanda..."
        for i in $$(seq 1 60); do
          if rpk cluster health --api-urls redpanda:9644 2>/dev/null | grep -q "Healthy"; then
            echo "Redpanda is healthy!"
            break
          fi
          echo "Attempt $$i/60..."
          sleep 5
        done
        rpk topic create edge-sensor-data \
          --brokers redpanda:9092 \
          --partitions 10 \
          --replicas 1 \
          --topic-config retention.ms=86400000 \
          2>/dev/null && echo "Created topic: edge-sensor-data" \
          || echo "Topic edge-sensor-data already exists"
        echo "Cloud topics ready:"
        rpk topic list --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - cloud-network
    restart: "no"

  # ============================================
  # Init: Cassandra Schema
  # ============================================
  cassandra-init:
    image: cassandra:4.1
    container_name: cloud-cassandra-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Cassandra..."
        for i in $$(seq 1 60); do
          if cqlsh cassandra -e "DESCRIBE CLUSTER" >/dev/null 2>&1; then
            echo "Cassandra is ready!"
            break
          fi
          echo "Attempt $$i/60..."
          sleep 5
        done
        echo "Applying schema..."
        cqlsh cassandra -f /schema/cassandra-schema.cql
        echo "Schema applied!"
        cqlsh cassandra -e "DESCRIBE KEYSPACE iot_data;"
    volumes:
      - ./init/cassandra-schema.cql:/schema/cassandra-schema.cql:ro
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cloud-network
    restart: "no"

  # ============================================
  # Cassandra Writer (Redpanda -> Cassandra)
  # ============================================
  cassandra-writer:
    image: cassandra-writer:latest
    build:
      context: ./services/cassandra-writer
      dockerfile: Dockerfile
    container_name: cloud-cassandra-writer
    environment:
      - REDPANDA_BROKERS=redpanda:9092
      - REDPANDA_TOPIC=edge-sensor-data
      - CONSUMER_GROUP=cassandra-writer
      - CASSANDRA_HOSTS=cassandra
      - BATCH_SIZE=500
      - FLUSH_INTERVAL=5
    depends_on:
      redpanda:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - cloud-network
    restart: unless-stopped

  # ============================================
  # Cloud API (FastAPI)
  # ============================================
  cloud-api:
    image: cloud-api:latest
    build:
      context: ./services/cloud-api
      dockerfile: Dockerfile
    container_name: cloud-api
    ports:
      - "8000:8000"   # REST API
    environment:
      - CASSANDRA_HOSTS=cassandra
      - API_PORT=8000
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - cloud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  cloud-network:
    driver: bridge

volumes:
  cloud-redpanda-data:
  cassandra-data:
  minio-data:
